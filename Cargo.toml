[workspace]
members = [
    "crates/parser",
    "crates/codegen",
    "crates/syntax",
    "crates/lsp",
    "crates/cli",
    "crates/mat",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
cranelift = "0.130.1"
cranelift-jit = "0.130.1"
cranelift-module = "0.130.1"
cranelift-native = "0.130.1"
cranelift-object = "0.130.1"
env_logger = "0.11.10"
log = "0.4.29"
logos = "0.14.4"
rand = "0.10.0"
linear-map = "1.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Internal workspace crates
mantis_parser = { path = "crates/parser" }
mantis_codegen = { path = "crates/codegen" }
mantis_syntax = { path = "crates/syntax" }
mantis_lsp = { path = "crates/lsp" }
