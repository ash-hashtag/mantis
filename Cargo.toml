[workspace]
members = [
    "crates/parser",
    "crates/codegen",
    "crates/syntax",
    "crates/lsp",
    "crates/cli",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
cranelift = "0.135.0"
cranelift-jit = "0.135.0"
cranelift-module = "0.135.0"
cranelift-native = "0.135.0"
cranelift-object = "0.135.0"
env_logger = "0.11.11"
log = "0.4.34"
logos = "0.16.1"
rand = "0.10.2"
linear-map = "1.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Internal workspace crates
mantis_parser = { path = "crates/parser" }
mantis_codegen = { path = "crates/codegen" }
mantis_syntax = { path = "crates/syntax" }
mantis_lsp = { path = "crates/lsp" }
